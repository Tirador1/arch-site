<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Demo preview. Bilingual company website with CMS.">
<title>STRUCTA · Engineering &amp; Architecture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Monochrome palette
   #050505  #403F3F  #959294  #C2BEC0  #D4D1D3
   ============================================================ */
:root{
  --ink:#050505;
  --slate:#403F3F;
  --mid:#959294;
  --soft:#C2BEC0;
  --paper:#D4D1D3;
  --white:#ffffff;
  --pad:clamp(20px,5vw,80px);
  --fs-display:clamp(38px,6.4vw,104px);
  --fs-h2:clamp(28px,4.6vw,68px);
  --fs-h3:clamp(18px,2vw,26px);
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Archivo',"Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.55;
  overflow-x:hidden;
}
html[dir="rtl"] body{font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif}
img{display:block;max-width:100%;height:auto;background:var(--slate)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ---------- shared type ---------- */
.eyebrow{
  font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--mid);font-weight:500;
}
html[dir="rtl"] .eyebrow{letter-spacing:0;text-transform:none;font-size:13px}
.display{
  font-size:var(--fs-display);line-height:.94;font-weight:600;
  letter-spacing:-.03em;text-transform:uppercase;
}
h2.sec{
  font-size:var(--fs-h2);line-height:.98;font-weight:600;
  letter-spacing:-.03em;text-transform:uppercase;
}
html[dir="rtl"] .display,
html[dir="rtl"] h2.sec{
  text-transform:none;letter-spacing:-.01em;line-height:1.18;font-weight:600;
}
.body-txt{font-size:clamp(13px,1.05vw,15px);color:var(--slate);max-width:52ch}
.dark .body-txt{color:var(--soft)}
.dark{background:var(--ink);color:var(--paper)}
section{position:relative;padding:clamp(56px,8vw,132px) var(--pad)}

/* ---------- demo bar ---------- */
#demobar{
  position:sticky;top:0;z-index:120;background:#111;color:#bdbdbd;
  font-size:12px;padding:7px var(--pad);display:flex;gap:14px;
  align-items:center;justify-content:space-between;flex-wrap:wrap;
  border-bottom:1px solid #262626;font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
}
#demobar b{color:#fff;font-weight:600}
#demobar .dot{width:6px;height:6px;border-radius:50%;background:#7ac77a;display:inline-block;margin-inline-end:7px}

/* ---------- header ---------- */
header{
  position:sticky;top:31px;z-index:100;background:var(--ink);color:var(--paper);
  display:flex;align-items:center;justify-content:space-between;
  gap:16px;padding:14px var(--pad);
}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.02em;font-size:15px}
.mark{width:22px;height:22px;flex:none}
.mark path{fill:var(--paper)}
nav.mainnav{display:flex;gap:26px;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
html[dir="rtl"] nav.mainnav{letter-spacing:0;text-transform:none;font-size:14px;gap:22px}
nav.mainnav a{opacity:.72;transition:opacity .25s}
nav.mainnav a:hover{opacity:1}
.hdr-right{display:flex;align-items:center;gap:14px}
.langbtn{
  border:1px solid #3a3a3a;border-radius:100px;padding:6px 14px;
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;transition:.25s;
}
.langbtn:hover{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.burger{display:none;flex-direction:column;gap:4px}
.burger span{width:20px;height:1.5px;background:var(--paper);display:block}

/* ---------- hero ---------- */
.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:0;background:var(--ink)}
.strip figure{position:relative;overflow:hidden;aspect-ratio:3/4}
.strip img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.08);
  transition:transform 1.1s var(--ease),filter .6s}
.strip figure:hover img{transform:scale(1.06);filter:grayscale(1) contrast(1.25)}

.hero{
  background:var(--ink);color:var(--paper);
  padding:clamp(40px,6vw,88px) var(--pad) clamp(56px,7vw,104px);
  display:grid;grid-template-columns:1fr auto;gap:36px;align-items:end;
}
.hero .display{max-width:14ch}
.hero p{margin-top:22px;color:var(--soft);max-width:44ch;font-size:clamp(13px,1.05vw,15px)}
.badge{
  width:132px;height:132px;border:1px solid #4a4a4a;border-radius:50%;
  display:grid;place-items:center;text-align:center;font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;line-height:1.5;flex:none;
  transition:background .35s,color .35s,border-color .35s;
}
html[dir="rtl"] .badge{letter-spacing:0;text-transform:none;font-size:12px}
.badge:hover{background:var(--paper);color:var(--ink);border-color:var(--paper)}

/* ---------- ghost watermark ---------- */
.ghost{
  position:absolute;pointer-events:none;opacity:.055;width:min(46vw,520px);
  inset-inline-end:2%;top:12%;
}
.ghost path{fill:currentColor}

/* ---------- about ---------- */
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,4vw,72px);align-items:start;margin-top:clamp(28px,4vw,64px)}
.about-grid img{width:100%;aspect-ratio:4/3.4;object-fit:cover;filter:grayscale(1)}
.sincewrap{margin-top:26px;text-align:end}
.since{font-size:clamp(15px,1.6vw,22px);font-weight:600;letter-spacing:-.02em;text-transform:uppercase}
html[dir="rtl"] .since{text-transform:none}
/* team + testimonial placeholders (no stock faces on a demo) */
.avatar{
  position:relative;width:100%;aspect-ratio:3/4;background:
    repeating-linear-gradient(135deg,#2b2b2b 0 2px,transparent 2px 11px),
    linear-gradient(160deg,#4a4a4a,#1c1c1c);
  display:grid;place-items:center;overflow:hidden;
}
.avatar b.mono{
  font-size:clamp(30px,3.4vw,46px);font-weight:700;color:rgba(255,255,255,.16);
  letter-spacing:.04em;line-height:1;transition:color .45s;
}
.member:hover .avatar b.mono{color:rgba(255,255,255,.3)}
.qmono{
  width:40px;height:40px;border-radius:50%;background:var(--slate);color:var(--soft);
  display:grid;place-items:center;font-size:13px;font-weight:600;flex:none;
}

/* ---------- section head with arrows ---------- */
.sechead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.arrows{display:flex;gap:8px}
.arrows button{
  width:42px;height:42px;border:1px solid currentColor;border-radius:2px;
  display:grid;place-items:center;opacity:.55;transition:.25s;
}
.arrows button:hover{opacity:1;background:currentColor}
.arrows button:hover svg path{stroke:var(--ink)}
.dark .arrows button:hover svg path{stroke:var(--ink)}
.arrows svg{width:15px;height:15px}
.arrows svg path{stroke:currentColor;stroke-width:1.4;fill:none}
html[dir="rtl"] .arrows{transform:scaleX(-1)}

/* ---------- rail (carousels) ---------- */
.rail{
  display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;
  margin-top:clamp(24px,3vw,48px);padding-bottom:6px;scrollbar-width:thin;
}
.rail::-webkit-scrollbar{height:3px}
.rail::-webkit-scrollbar-thumb{background:var(--mid)}
.rail>*{scroll-snap-align:start;flex:0 0 clamp(260px,31%,420px)}

/* ---------- services ---------- */
.svc{position:relative;aspect-ratio:3/4;overflow:hidden;background:var(--slate)}
.svc img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) brightness(.62);
  transition:transform 1s var(--ease),filter .5s}
.svc:hover img{transform:scale(1.07);filter:grayscale(1) brightness(.48)}
.svc .meta{position:absolute;top:14px;inset-inline-start:14px;display:flex;gap:6px;flex-wrap:wrap}
.svc .meta span{
  background:rgba(255,255,255,.14);backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.18);padding:4px 9px;font-size:10px;
  letter-spacing:.06em;color:#fff;border-radius:2px;
}
.svc .body{position:absolute;inset-inline:14px;bottom:14px;color:#fff}
.svc h3{font-size:var(--fs-h3);font-weight:600;line-height:1.05;letter-spacing:-.02em;text-transform:uppercase}
html[dir="rtl"] .svc h3{text-transform:none;line-height:1.3}
.svc p{font-size:12.5px;color:#d8d8d8;margin-top:8px;max-width:34ch}
.cta{
  margin-top:14px;background:var(--white);color:var(--ink);width:100%;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:11px 14px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;
  transition:.28s;
}
html[dir="rtl"] .cta{letter-spacing:0;text-transform:none;font-size:13px}
.cta:hover{background:var(--ink);color:var(--white);outline:1px solid var(--white)}
html[dir="rtl"] .cta .ar-flip{transform:scaleX(-1)}

/* ---------- projects ---------- */
.proj{position:relative}
.proj .num{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--mid);padding-bottom:9px;border-bottom:1px solid rgba(0,0,0,.16)}
html[dir="rtl"] .proj .num{letter-spacing:0;text-transform:none;font-size:13px}
.proj img{width:100%;aspect-ratio:4/5;object-fit:cover;filter:grayscale(1);margin-top:12px;
  transition:filter .5s,transform .9s var(--ease)}
.proj:hover img{filter:grayscale(1) contrast(1.15);transform:scale(1.02)}
.proj h3{margin-top:12px;font-size:15px;font-weight:600;letter-spacing:-.01em;text-transform:uppercase}
html[dir="rtl"] .proj h3{text-transform:none;font-size:17px}
.proj span.loc{font-size:12px;color:var(--mid)}
.dots{display:flex;gap:7px;justify-content:center;margin-top:26px}
.dots i{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.28;transition:.3s}
.dots i.on{opacity:1;transform:scale(1.35)}

/* ---------- process ---------- */
.steps{margin-top:clamp(28px,4vw,60px);display:grid;gap:clamp(28px,4vw,64px)}
.step{display:grid;grid-template-columns:1fr 1fr;gap:clamp(20px,4vw,64px);align-items:center}
.step:nth-child(even) .txt{order:2}
.step img{width:100%;aspect-ratio:4/3;object-fit:cover;filter:grayscale(1) brightness(.9)}
.step .k{font-size:11px;letter-spacing:.16em;color:var(--mid);text-transform:uppercase}
html[dir="rtl"] .step .k{letter-spacing:0;text-transform:none;font-size:13px}
.step h3{font-size:clamp(20px,2.6vw,34px);font-weight:600;letter-spacing:-.02em;
  text-transform:uppercase;margin-top:8px;line-height:1}
html[dir="rtl"] .step h3{text-transform:none;line-height:1.25}
.step p{margin-top:10px;font-size:13.5px;color:var(--soft);max-width:44ch}

/* ---------- team ---------- */
.team{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:clamp(28px,4vw,56px)}
.member{position:relative;overflow:hidden;background:var(--slate)}
.member .info{position:absolute;inset-inline:12px;bottom:12px;color:#fff}
.member .info b{display:block;font-size:14px;font-weight:600;letter-spacing:-.01em}
.member .info span{font-size:11.5px;color:#cfcfcf}

/* ---------- testimonials ---------- */
.quotewrap{max-width:820px;margin:clamp(28px,4vw,56px) auto 0;text-align:center}
.client-logo{font-size:17px;font-weight:600;letter-spacing:.02em;display:inline-flex;align-items:center;gap:8px}
.quote{font-size:clamp(15px,1.55vw,21px);line-height:1.62;margin-top:22px;color:var(--paper)}
.who{margin-top:24px;display:flex;align-items:center;justify-content:center;gap:11px}
.who img{width:40px;height:40px;border-radius:50%;object-fit:cover;filter:grayscale(1)}
.who b{font-size:13.5px;font-weight:600;display:block}
.who span{font-size:11.5px;color:var(--mid)}
.who .t{text-align:start}

/* ---------- contact ---------- */
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(26px,5vw,80px);align-items:center}
form{background:var(--white);color:var(--ink);padding:clamp(22px,3vw,38px)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.field{margin-bottom:18px}
.field label{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--slate);margin-bottom:6px}
html[dir="rtl"] .field label{letter-spacing:0;text-transform:none;font-size:13px}
.field input,.field textarea{
  width:100%;border:0;border-bottom:1px solid #c9c9c9;background:transparent;
  padding:8px 0;font-size:14px;font-family:inherit;transition:border-color .3s;
}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--ink)}
.field textarea{resize:vertical;min-height:76px}
.submit{
  width:100%;background:var(--ink);color:var(--white);padding:14px 18px;
  display:flex;align-items:center;justify-content:space-between;
  font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;transition:.28s;
}
html[dir="rtl"] .submit{letter-spacing:0;text-transform:none;font-size:14px}
.submit:hover{background:var(--slate)}
html[dir="rtl"] .submit .ar-flip{transform:scaleX(-1)}
.reach{display:flex;flex-direction:column;gap:12px;margin-top:26px}
.reach a{
  display:inline-flex;align-items:center;gap:10px;font-size:13.5px;
  border:1px solid #3d3d3d;padding:11px 16px;transition:.28s;width:fit-content;
}
.reach a:hover{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.reach svg{width:16px;height:16px;flex:none}
.formnote{font-size:11.5px;color:var(--mid);margin-top:12px}

/* ---------- footer ---------- */
footer{background:var(--paper);color:var(--ink);padding:clamp(48px,6vw,96px) var(--pad) 0;text-align:center;overflow:hidden}
footer .display{max-width:20ch;margin:0 auto}
.footnav{display:flex;gap:22px;justify-content:center;flex-wrap:wrap;margin-top:34px;
  font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--slate)}
html[dir="rtl"] .footnav{letter-spacing:0;text-transform:none;font-size:13.5px}
.footcta{
  display:inline-flex;align-items:center;gap:9px;margin-top:26px;background:var(--ink);color:var(--paper);
  padding:13px 26px;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;transition:.28s;
}
html[dir="rtl"] .footcta{letter-spacing:0;text-transform:none;font-size:14px}
.footcta:hover{background:var(--slate)}
.socials{display:flex;gap:9px;justify-content:center;margin-top:30px;flex-wrap:wrap}
.socials a{
  border:1px solid #b4b1b3;border-radius:100px;padding:7px 16px;font-size:11px;
  letter-spacing:.08em;color:var(--slate);transition:.28s;
}
.socials a:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.legal{font-size:11.5px;color:var(--mid);margin-top:34px;display:flex;justify-content:space-between;
  gap:14px;flex-wrap:wrap;text-align:start;border-top:1px solid #bfbcbe;padding-top:16px}
.wordmark{
  font-size:clamp(58px,17.5vw,260px);font-weight:800;letter-spacing:-.045em;line-height:.78;
  color:var(--mid);opacity:.5;margin-top:20px;user-select:none;
}
html[dir="rtl"] .wordmark{letter-spacing:-.01em;line-height:1.05;font-size:clamp(44px,13vw,190px)}

/* ---------- marquee ---------- */
.marquee{background:var(--ink);color:var(--paper);overflow:hidden;padding:13px 0;border-block:1px solid #222}
.marquee div{display:flex;gap:44px;white-space:nowrap;animation:slide 26s linear infinite;font-size:12px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--mid)}
html[dir="rtl"] .marquee div{letter-spacing:0;text-transform:none;font-size:14px}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ---------- reveal ---------- */
.rv{opacity:0;transform:translateY(26px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  .rv{opacity:1;transform:none;transition:none}
  .marquee div,.badge .rot{animation:none}
  html{scroll-behavior:auto}
}

/* ---------- responsive ---------- */
@media(max-width:900px){
  .strip{grid-template-columns:repeat(3,1fr)}
  .strip figure:nth-child(4),.strip figure:nth-child(5){display:none}
  .hero{grid-template-columns:1fr}
  .about-grid,.step,.contact-grid{grid-template-columns:1fr}
  .step:nth-child(even) .txt{order:0}
  .team{grid-template-columns:repeat(2,1fr)}
  nav.mainnav{display:none}
  .burger{display:flex}
  .rail>*{flex:0 0 78%}
}
@media(max-width:520px){
  .f2{grid-template-columns:1fr}
  .strip{grid-template-columns:repeat(2,1fr)}
  .strip figure:nth-child(3){display:none}
  .legal{justify-content:center;text-align:center}
}
</style>
</head>
<body>

<!-- ======================= DEMO BAR ======================= -->
<div id="demobar">
  <span><span class="dot"></span><b>نسخة عرض</b> · الاسم والشعار والصور والنصوص التجريبية مؤقتة، تُستبدل بمحتوى الشركة</span>
  <span>الأقسام كاملة · عربي وإنكليزي · جرّب زر اللغة فوق</span>
</div>

<!-- ======================= HEADER ======================= -->
<header>
  <a href="#top" class="brand">
    <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 22 20h-5.2L12 11.4 7.2 20H2L12 2Zm0 8.2 3 5.4H9l3-5.4Z"/></svg>
    <span>STRUCTA</span>
  </a>
  <nav class="mainnav">
    <a href="#about"  data-en="About"    data-ar="من نحن"></a>
    <a href="#svc"    data-en="Services" data-ar="الخدمات"></a>
    <a href="#proj"   data-en="Projects" data-ar="المشاريع"></a>
    <a href="#team"   data-en="Team"     data-ar="فريق العمل"></a>
    <a href="#says"   data-en="Clients"  data-ar="آراء العملاء"></a>
  </nav>
  <div class="hdr-right">
    <button class="langbtn" id="lang">العربية</button>
    <a href="#contact" class="langbtn" data-en="Contact Us" data-ar="تواصل معنا"></a>
    <span class="burger" aria-hidden="true"><span></span><span></span><span></span></span>
  </div>
</header>

<!-- ======================= HERO ======================= -->
<div id="top" class="strip">
  <figure><img loading="eager" width="600" height="800" src="img/hero1.jpg" alt=""></figure>
  <figure><img loading="eager" width="600" height="800" src="img/hero3.jpg" alt=""></figure>
  <figure><img loading="eager" width="600" height="680" src="img/hero4.jpg" alt=""></figure>
  <figure><img loading="lazy" width="600" height="800" src="img/hero5.jpg" alt=""></figure>
  <figure><img loading="lazy" width="600" height="800" src="img/s1.jpg" alt=""></figure>
</div>

<div class="hero">
  <div>
    <h1 class="display" data-en="From the first line to the final handover" data-ar="من أول خط على الورق حتى التسليم النهائي"></h1>
    <p data-en="Architectural, structural, electrical and mechanical design. Studies, technical drawings, execution and site supervision." data-ar="تصاميم معمارية وإنشائية وكهربائية وميكانيكية. دراسات ورسومات فنية تفصيلية، وتنفيذ بإشراف دقيق على الموقع."></p>
  </div>
  <a href="#proj" class="badge"><span class="rot" data-en="Explore<br>our work" data-ar="شوف<br>مشاريعنا"></span></a>
</div>

<div class="marquee"><div id="mq"></div></div>

<!-- ======================= ABOUT ======================= -->
<section id="about">
  <svg class="ghost" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 22 20h-5.2L12 11.4 7.2 20H2L12 2Zm0 8.2 3 5.4H9l3-5.4Z"/></svg>
  <div class="sechead rv">
    <h2 class="sec" data-en="Design and execution<br>under one roof" data-ar="التصميم والتنفيذ<br>تحت سقف واحد"></h2>
    <span class="eyebrow" data-en="(01) About Us" data-ar="(٠١) من نحن"></span>
  </div>
  <div class="about-grid">

<script>
/* ---------------- language ----------------
   Open demo.html?lang=ar to land straight on the Arabic version. */
var AR = /[?&]lang=ar\b/.test(location.search);
var qData = [
  {logo:"Acme Corp",
   en:"They handled design and execution together, so we never had to chase two different teams. The drawings matched what was actually built on site.",
   ar:"تولّوا التصميم والتنفيذ مع بعض، فما اضطرينا نلاحق فريقين مختلفين. الرسومات طلعت مطابقة لللي انبنى على الأرض.",
   nameEn:"Client name", nameAr:"اسم العميل", roleEn:"Project owner", roleAr:"صاحب المشروع", ini:"AC"},
  {logo:"Northline",
   en:"Detailed technical drawings and a clear bill of quantities. Site supervision caught issues before they turned into cost.",
   ar:"رسومات فنية تفصيلية وجدول كميات واضح. الإشراف على الموقع لقط المشاكل قبل ما تتحول لتكلفة.",
   nameEn:"Client name", nameAr:"اسم العميل", roleEn:"General contractor", roleAr:"مقاول عام", ini:"NL"},
  {logo:"Meridian",
   en:"The topographic survey was delivered on time and the restoration work respected the original structure.",
   ar:"المسح الطبوغرافي تسلّمناه بالوقت، وأعمال الترميم حافظت على البناء الأصلي.",
   nameEn:"Client name", nameAr:"اسم العميل", roleEn:"Property owner", roleAr:"مالك عقار", ini:"MD"}
];

function paint(){
  document.querySelectorAll('[data-en]').forEach(function(el){
    el.innerHTML = AR ? el.dataset.ar : el.dataset.en;
  });
  document.querySelectorAll('[data-en-ph]').forEach(function(el){
    el.placeholder = AR ? el.dataset.arPh : el.dataset.enPh;
  });
  document.documentElement.dir  = AR ? 'rtl' : 'ltr';
  document.documentElement.lang = AR ? 'ar'  : 'en';
  document.getElementById('lang').textContent = AR ? 'English' : 'العربية';
  var tags = AR
    ? ['تصميم معماري','تصميم إنشائي','كهرباء وميكانيك','دراسات واستشارات','رسومات تنفيذية','بناء وتجديد','ترميم','مسح طبوغرافي GPS-GNSS']
    : ['ARCHITECTURAL DESIGN','STRUCTURAL DESIGN','ELECTRICAL &amp; MECHANICAL','STUDIES &amp; CONSULTING','TECHNICAL DRAWINGS','CONSTRUCTION &amp; RENOVATION','RESTORATION','GPS-GNSS SURVEY'];
  var line = tags.map(function(t){return '<span>'+t+'</span><span>·</span>';}).join('');
  document.getElementById('mq').innerHTML = line + line;
  document.getElementById('wm').textContent = AR ? 'اسم الشركة' : 'STRUCTA';
  paintQuote();
}
document.getElementById('lang').addEventListener('click', function(){ AR = !AR; paint(); });

/* ---------------- testimonials ---------------- */
var qi = 0;
function paintQuote(){
  var q = qData[qi];
  document.getElementById('q-logo').innerHTML = '&#10022; ' + q.logo;
  document.getElementById('q-text').textContent = AR ? q.ar : q.en;
  document.getElementById('q-name').textContent = AR ? q.nameAr : q.nameEn;
  document.getElementById('q-role').textContent = AR ? q.roleAr : q.roleEn;
  document.getElementById('q-img').textContent = q.ini;
  document.querySelectorAll('#q-dots i').forEach(function(d,i){ d.classList.toggle('on', i===qi); });
}
document.querySelectorAll('#q-arrows button').forEach(function(b){
  b.addEventListener('click', function(){
    qi = (qi + Number(b.dataset.dir) + qData.length) % qData.length;
    paintQuote();
  });
});
document.querySelectorAll('#q-dots i').forEach(function(d,i){
  d.addEventListener('click', function(){ qi = i; paintQuote(); });
});

/* ---------------- rails ---------------- */
document.querySelectorAll('.arrows[data-rail]').forEach(function(group){
  var rail = document.getElementById(group.dataset.rail);
  group.querySelectorAll('button').forEach(function(b){
    b.addEventListener('click', function(){
      var card = rail.querySelector(':scope > *');
      var step = card ? card.getBoundingClientRect().width + 14 : 320;
      var sign = document.documentElement.dir === 'rtl' ? -1 : 1;
      rail.scrollBy({left: step * Number(b.dataset.dir) * sign, behavior:'smooth'});
    });
  });
});
var projRail = document.getElementById('proj-rail');
projRail.addEventListener('scroll', function(){
  var card = projRail.querySelector(':scope > *');
  if(!card) return;
  var step = card.getBoundingClientRect().width + 14;
  var i = Math.round(Math.abs(projRail.scrollLeft) / step);
  document.querySelectorAll('#proj-dots i').forEach(function(d,n){ d.classList.toggle('on', n===i); });
});

/* ---------------- reveal on scroll ---------------- */
var io = new IntersectionObserver(function(entries){
  entries.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
}, {threshold:.12, rootMargin:'0px 0px -8% 0px'});
document.querySelectorAll('.rv').forEach(function(el){ io.observe(el); });

paint();
</script>
